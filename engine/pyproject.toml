[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshield-engine"
version = "0.2.0"
description = "Local-first sensitive data scanner for developer workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "CodeShield AI" }]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0"
]

[project.scripts]
codeshield = "codeshield.cli:app"

[tool.setuptools.packages.find]
include = ["codeshield*"]

[tool.setuptools.package-data]
"codeshield.policies" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
