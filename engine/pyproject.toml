[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshield-engine"
version = "0.9.0"
description = "Local-first sensitive data scanner for developer workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "CodeShield AI" }]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "typer>=0.12,<1.0",
  "unidiff>=0.7.5,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0"
]
enhanced = [
  "presidio-analyzer==2.2.363",
  "spacy>=3.8,<3.9",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
]
evaluation = [
  "presidio-evaluator==0.2.5",
  "Faker==40.31.0"
]

[project.scripts]
codeshield = "codeshield.cli:app"

[tool.setuptools.packages.find]
include = ["codeshield*"]

[tool.setuptools.package-data]
"codeshield.policies" = ["*.yaml"]
"codeshield.providers" = ["*.yaml"]
"codeshield.evaluation" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
