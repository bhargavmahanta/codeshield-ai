schema_version: 2
repository_visibility: private
policy_file: policies/default.yaml
public_code_paths: []
detectors:
  profile: core
  fragments:
    enabled: true
    max_fragments: 8
    max_reconstructed_length: 512
  presidio:
    language: en
    model: en_core_web_sm
    score_threshold: 0.55
  gitleaks:
    executable: gitleaks
    timeout_seconds: 5.0
