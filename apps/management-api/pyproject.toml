[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshield-management-api"
version = "0.9.0"
description = "Metadata-only CodeShield organizational management service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "codeshield-engine>=0.9.0,<0.10.0",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0"]

[project.scripts]
codeshield-management-api = "codeshield_management_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codeshield_management_api*"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src", "../../engine"]
