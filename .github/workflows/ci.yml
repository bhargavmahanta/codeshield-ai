name: CodeShield CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-determinism:
    name: contract-determinism (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install contract dependencies
        run: |
          python -m pip install -e ./engine
          npm ci

      - name: Build-tool unit tests
        run: node --test scripts/build-tools.test.mjs

      - name: Deterministic contract drift
        env:
          CODESHIELD_PYTHON: python
        run: npm run check:contracts

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python engine
        run: python -m pip install -e "./engine[dev,evaluation]"

      - name: Python tests
        run: python -m pytest engine/tests

      - name: Secret-free fixture check
        run: python engine/scripts/check_test_fixtures.py

      - name: Provider evidence freshness
        run: python engine/scripts/check_provider_profiles.py

      - name: Core evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase6 --profile core --output "${{ runner.temp }}/core.json"
          codeshield evaluate compare reports/phase6/core-baseline.json "${{ runner.temp }}/core.json"

      - name: Install npm workspaces
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: TypeScript build
        run: npm run build

      - name: Vitest
        run: npm test

      - name: Generated contract drift
        run: npm run check:contracts

      - name: Package contents
        run: npm run pack:check

      - name: Live SDK contract smoke test
        shell: bash
        run: |
          codeshield server --host 127.0.0.1 --port 8765 > /tmp/codeshield.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/health >/dev/null && break
            sleep 0.5
          done
          node packages/sdk/dist/demo.js

      - name: Reconstruct and scan changed additions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/codeshield-index"
          git read-tree "$BASE_SHA"
          git add -A
          codeshield check-staged --destination private_git

  enhanced-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install enhanced engine
        run: python -m pip install -e "./engine[dev,enhanced,evaluation]"

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Optional detector security tests
        run: python -m pytest engine/tests/test_optional_detectors.py engine/tests/test_evaluation_phase5.py

      - name: Enhanced evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          gitleaks version
          codeshield evaluate run --suite phase6 --profile enhanced --output "${{ runner.temp }}/enhanced.json"
          codeshield evaluate compare reports/phase6/core-baseline.json "${{ runner.temp }}/enhanced.json"

      - name: Phase 8 enhanced proxy evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase8 --profile enhanced --output "${{ runner.temp }}/phase8-enhanced.json"
          codeshield evaluate compare reports/phase8/enhanced-baseline.json "${{ runner.temp }}/phase8-enhanced.json"

      - name: Phase 9 enhanced management evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase9 --profile enhanced --output "${{ runner.temp }}/phase9-enhanced.json"
          codeshield evaluate compare reports/phase9/enhanced-baseline.json "${{ runner.temp }}/phase9-enhanced.json"

  windows-interoperability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -e "./engine[dev,evaluation]"
          npm ci

      - name: Repeatable clean TypeScript build
        run: |
          npm run build
          npm run build

      - name: Contract drift without tracked writes
        env:
          CODESHIELD_PYTHON: python
        run: npm run check:contracts

      - name: TypeScript checks
        run: |
          npm run typecheck
          npm test
          npm run pack:check

      - name: Phase 6 interoperability tests
        run: >-
          python -m pytest
          engine/tests/test_fragment_detector.py
          engine/tests/test_sarif.py
          engine/tests/test_api.py
          engine/tests/test_cli.py
          engine/tests/test_management.py

      - name: Phase 6 core evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase6 --profile core --output "${{ runner.temp }}/core.json"
          codeshield evaluate compare reports/phase6/core-baseline.json "${{ runner.temp }}/core.json"

  proxy-integration:
    name: proxy-integration (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install local engine and evaluation dependencies
        run: python -m pip install -e "./engine[dev,evaluation]"

      - name: Mock-upstream proxy security tests
        run: python -m pytest engine/tests/test_proxy.py

      - name: Phase 8 proxy evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase8 --profile core --output "${{ runner.temp }}/phase8-core.json"
          codeshield evaluate compare reports/phase8/core-baseline.json "${{ runner.temp }}/phase8-core.json"

      - name: Local mock-proxy latency gate
        run: python engine/scripts/benchmark_proxy.py

  vscode-extension:
    name: vscode-extension (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode: ["1.127.0", "1.130.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install local engine and extension dependencies
        run: |
          python -m pip install -e "./engine[dev]"
          npm ci

      - name: Extension unit checks
        run: |
          npm run typecheck --workspace packages/vscode-extension
          npm run test --workspace packages/vscode-extension
          npm run build --workspace packages/vscode-extension

      - name: Extension host tests (Ubuntu)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration --workspace packages/vscode-extension

      - name: Extension host tests (Windows)
        if: runner.os == 'Windows'
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration --workspace packages/vscode-extension

      - name: Validate local VSIX contents
        if: runner.os == 'Linux' && matrix.vscode == '1.130.0'
        run: npm run package:vsix

  management-plane:
    name: management-plane (Ubuntu, Python 3.12, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            apps/management-api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install local management dependencies
        run: |
          python -m pip install -e "./engine[dev,evaluation]" -e "./apps/management-api[dev]"
          npm ci

      - name: Replay local Supabase and run database checks
        shell: bash
        run: |
          npx supabase start
          trap 'npx supabase stop --no-backup' EXIT
          npx supabase test db
          npx supabase db lint --local --level warning

          status="$(npx supabase status -o env)"
          export SUPABASE_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' <<<"$status")"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$(sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p' <<<"$status")"
          export NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          export CODESHIELD_MANAGEMENT_API_URL="http://127.0.0.1:8766"
          export CODESHIELD_LOCAL_SUPABASE_TEST=1

          python -m pytest apps/management-api/tests
          npm run test --workspace apps/dashboard
          npm run typecheck --workspace apps/dashboard
          npm run build --workspace apps/dashboard
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace apps/dashboard

      - name: Phase 9 management evaluation gates
        env:
          CODESHIELD_DATA_HOME: ${{ runner.temp }}/codeshield-datasets
        run: |
          codeshield evaluate run --suite phase9 --profile core --output "${{ runner.temp }}/phase9-core.json"
          codeshield evaluate compare reports/phase9/core-baseline.json "${{ runner.temp }}/phase9-core.json"

      - name: Signed-policy pull latency gate
        run: python engine/scripts/benchmark_management.py
